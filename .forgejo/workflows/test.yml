name: Test

on:
  push:
    branches:
      - feature/*
      - hotfix/*
      - renovate/*

jobs:
  build:
    runs-on: node

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - name: Backend tests
      run: yarn test:backend
    - name: Frontend tests
      run: yarn test:frontend
